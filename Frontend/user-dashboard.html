<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Dashboard | Lumina Books</title>
    <link rel="stylesheet" href="css/lumina.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dash-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 3rem;
            margin-top: 3rem;
        }
        .dash-sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            height: fit-content;
        }
        .user-avatar {
            width: 100px;
            height: 100px;
            background: var(--primary-glow);
            border: 2px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--primary);
            font-weight: 800;
        }
        .dash-nav {
            list-style: none;
            margin-top: 2rem;
        }
        .dash-nav li {
            margin-bottom: 0.5rem;
        }
        .dash-nav a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .dash-nav a.active, .dash-nav a:hover {
            background: rgba(139, 92, 246, 0.1);
            color: var(--primary);
        }
        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--accent); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">Lumina Books</a>
        <ul class="nav-links">
            <li><a href="browse.html">Browse</a></li>
            <li><a href="browse.html?cat=Bestsellers">Bestsellers</a></li>
            <li><a href="browse.html?cat=New Arrivals">New Arrivals</a></li>
        </ul>
        <div class="nav-actions">
            <a href="cart.html" style="color:white; position:relative;">
                <i class="fas fa-shopping-cart" style="font-size:1.2rem;"></i>
                <span id="cartCount" style="position:absolute;top:-8px;right:-8px;background:var(--primary);color:white;font-size:0.6rem;font-weight:900;padding:2px 6px;border-radius:10px;display:none;"></span>
            </a>
            <div id="authActions" style="display: flex; gap: 1rem; align-items: center;">
                <!-- User avatar injected via JS -->
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dash-layout">
            <aside class="dash-sidebar">
                <div class="user-avatar" id="avatarInitials">U</div>
                <h3 id="userName" style="text-align: center; margin-bottom: 0.5rem;">User Name</h3>
                <p id="userEmail" style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem;">user@example.com</p>
                
                <ul class="dash-nav">
                    <li><a href="#" class="active"><i class="fas fa-history"></i> Order History</a></li>
                    <li><a href="#"><i class="fas fa-heart"></i> My Wishlist</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </aside>

            <main>
                <h2 style="font-size: 2rem; margin-bottom: 2rem;">Order History</h2>
                <div id="orderList">
                    <div style="text-align: center; padding: 5rem;">
                        <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
                        <p style="margin-top: 1rem; color: var(--text-muted);">Loading your history...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const user = session.get();
        if (!user || user.userType === 'ADMIN') window.location.href = 'login.html';

        if (user) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.gmail;
            document.getElementById('avatarInitials').textContent = user.name.charAt(0).toUpperCase();

            // Populate authActions in navbar
            const authActions = document.getElementById('authActions');
            authActions.innerHTML = `
                <div style="display: flex; align-items: center; gap: 1.5rem;">
                    <a href="user-dashboard.html" style="color: var(--primary); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 0.8rem;">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=8b5cf6&color=fff&bold=true" style="width: 32px; height: 32px; border-radius: 50%;">
                        <span>${user.name.split(' ')[0]}</span>
                    </a>
                    <button onclick="session.clear(); window.location.href='login.html';" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;">Logout</button>
                </div>
            `;
        }
        const cartData = JSON.parse(localStorage.getItem('lumina_cart') || '[]');
        if (cartData.length > 0) {
            const count = document.getElementById('cartCount');
            count.textContent = cartData.length;
            count.style.display = 'block';
        }

        async function loadOrders() {
            try {
                const allOrders = await api.getOrders();
                const myOrders = allOrders.filter(o => o.userId === user.id);
                const list = document.getElementById('orderList');

                if (myOrders.length === 0) {
                    list.innerHTML = `
                        <div style="text-align: center; padding: 5rem; background: rgba(255,255,255,0.02); border-radius: var(--radius-lg); border: 1px dashed var(--border);">
                            <p style="color: var(--text-muted);">You haven't initiated any cosmic syncs yet.</p>
                            <a href="browse.html" class="btn btn-outline" style="margin-top: 1.5rem;">Start Browsing</a>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = myOrders.map(order => `
                    <div class="order-card">
                        <div>
                            <p style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;">Order #ORD-${String(order.id).padStart(4, '0')}</p>
                            <h3 style="margin-bottom: 0.25rem;">Sync Date: ${order.date}</h3>
                        </div>
                        <div style="text-align: right;">
                            <span class="badge badge-success">Delivered</span>
                            <p style="margin-top: 1rem;"><a href="#" style="color: var(--primary); font-size: 0.85rem; font-weight: 700; text-decoration: none;">View Details</a></p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('orderList').innerHTML = '<p style="color: #ef4444;">Failed to load order history.</p>';
            }
        }

        loadOrders();
    </script>
</body>
</html>
