<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestsellers | Celestial Hall of Fame</title>
    <link rel="stylesheet" href="css/lumina.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #02040a;
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.3);
            --primary: #8b5cf6;
        }

        body { background: var(--bg-deep); color: white; font-family: 'Outfit', sans-serif; }

        /* Navigation */
        nav {
            padding: 1.5rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 4, 10, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-logo { font-size: 1.6rem; font-weight: 800; color: white; text-decoration: none; }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: white; }

        /* Header */
        .hero-bestsellers {
            padding: 8rem 6% 4rem;
            text-align: center;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
        }
        .hero-bestsellers h1 { font-size: 4.5rem; font-weight: 900; letter-spacing: -3px; margin-bottom: 1rem; background: linear-gradient(to bottom, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-bestsellers p { color: var(--gold); font-weight: 800; letter-spacing: 4px; text-transform: uppercase; font-size: 0.8rem; }

        /* Ranking List */
        .ranking-container { max-width: 1200px; margin: 0 auto; padding: 4rem 6%; }
        
        .rank-item {
            display: grid;
            grid-template-columns: 100px 180px 1fr 200px;
            align-items: center;
            gap: 3rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 30px;
            padding: 2rem 3rem;
            margin-bottom: 2rem;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }
        .rank-item:hover {
            background: rgba(139, 92, 246, 0.05);
            border-color: var(--primary);
            transform: scale(1.02);
        }
        
        .rank-number { font-size: 3rem; font-weight: 900; color: rgba(255,255,255,0.05); font-style: italic; }
        .rank-item:nth-child(1) .rank-number { color: var(--gold); opacity: 0.3; }
        
        .rank-img { width: 140px; aspect-ratio: 2/3; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .rank-info h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .rank-info p { color: #94a3b8; line-height: 1.6; max-width: 500px; }
        
        .rank-action { text-align: right; }
        .price-tag { font-size: 1.5rem; font-weight: 800; display: block; margin-bottom: 1rem; }
        
        .buy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .buy-btn:hover { box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-3px); }

        /* Top 3 Spotlight */
        .spotlight-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 2rem; align-items: flex-end; margin-bottom: 8rem; padding: 0 6%; }
        .spotlight-card { background: #0b0f22; border: 1px solid rgba(255,255,255,0.05); border-radius: 40px; padding: 3rem; text-align: center; transition: 0.4s; }
        .spotlight-card.center { padding: 5rem 3rem; border-color: var(--gold); box-shadow: 0 0 50px var(--gold-glow); }
        .spotlight-card img { width: 100%; border-radius: 20px; margin-bottom: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">Lumina Books</a>
        <ul class="nav-links">
            <li><a href="browse.html">Browse</a></li>
            <li><a href="bestsellers.html" class="active">Bestsellers</a></li>
            <li><a href="new-arrivals.html">New Arrivals</a></li>
        </ul>
        <div id="navAuth"></div>
    </nav>

    <header class="hero-bestsellers">
        <p>Featured Collection</p>
        <h1>Hall of Fame</h1>
    </header>

    <div class="spotlight-grid" id="topSpotlight">
        <!-- Top 3 dynamically -->
    </div>

    <div class="ranking-container" id="rankingList">
        <!-- Other bestsellers -->
    </div>

    <script src="js/api.js"></script>
    <script>
        async function init() {
            try {
                const books = await api.getBooks();
                let bestsellers = books.filter(b => b.isBestseller).slice(0, 10);
                
                // Fallback: If no bestsellers marked, show top 3 latest books
                if (bestsellers.length === 0) {
                    bestsellers = books.slice(-3).reverse();
                }
                
                // Top Spotlight Area
                const spotlight = document.getElementById('topSpotlight');
                if (bestsellers.length > 0) {
                    let spotlightHtml = '';
                    
                    // Case for 1 bestseller
                    if (bestsellers.length === 1) {
                        spotlightHtml = `<div class="spotlight-card center" style="grid-column: 2;">
                            <div style="background:var(--gold); color:black; display:inline-block; padding:5px 15px; border-radius:50px; font-weight:900; margin-bottom:1rem;">CURRENT CHAMPION</div>
                            <img src="${api.getImageUrl(bestsellers[0].imagePath)}" onerror="this.src='https://placehold.co/300x450/1a1f2e/ffffff?text=Bestseller'">
                            <h2>${bestsellers[0].name}</h2>
                            <button class="buy-btn" style="margin-top:1.5rem; background:var(--gold); color:black;">Acquire Artifact</button>
                        </div>`;
                    } 
                    // Case for 2 bestsellers
                    else if (bestsellers.length === 2) {
                        spotlightHtml = `
                            <div class="spotlight-card" style="grid-column: 1 / 2;">
                                <span style="color:var(--gold); font-weight:900; font-size:1.5rem;">#2</span>
                                <img src="${api.getImageUrl(bestsellers[1].imagePath)}" onerror="this.src='https://placehold.co/300x450/1a1f2e/ffffff?text=Rank+2'">
                                <h3>${bestsellers[1].name}</h3>
                                <button class="buy-btn" style="margin-top:1.5rem;">Acquire Artifact</button>
                            </div>
                            <div class="spotlight-card center" style="grid-column: 2 / 4;">
                                <div style="background:var(--gold); color:black; display:inline-block; padding:5px 15px; border-radius:50px; font-weight:900; margin-bottom:1rem;">THE CROWN</div>
                                <img src="${api.getImageUrl(bestsellers[0].imagePath)}" onerror="this.src='https://placehold.co/300x450/1a1f2e/ffffff?text=Rank+1'">
                                <h2>${bestsellers[0].name}</h2>
                                <button class="buy-btn" style="margin-top:1.5rem; background:var(--gold); color:black;">Acquire Artifact</button>
                            </div>`;
                    }
                    // Case for 3+ bestsellers
                    else {
                        spotlightHtml = `
                            <div class="spotlight-card">
                                <span style="color:var(--gold); font-weight:900; font-size:1.5rem;">#2</span>
                                <img src="${api.getImageUrl(bestsellers[1].imagePath)}" onerror="this.src='https://placehold.co/300x450/1a1f2e/ffffff?text=Rank+2'">
                                <h3>${bestsellers[1].name}</h3>
                                <button class="buy-btn" style="margin-top:1.5rem;">Acquire Artifact</button>
                            </div>
                            <div class="spotlight-card center">
                                <div style="background:var(--gold); color:black; display:inline-block; padding:5px 15px; border-radius:50px; font-weight:900; margin-bottom:1rem;">THE CROWN</div>
                                <img src="${api.getImageUrl(bestsellers[0].imagePath)}" onerror="this.src='https://placehold.co/300x450/1a1f2e/ffffff?text=Rank+1'">
                                <h2>${bestsellers[0].name}</h2>
                                <button class="buy-btn" style="margin-top:1.5rem; background:var(--gold); color:black;">Acquire Artifact</button>
                            </div>
                            <div class="spotlight-card">
                                <span style="color:var(--gold); font-weight:900; font-size:1.5rem;">#3</span>
                                <img src="${api.getImageUrl(bestsellers[2].imagePath)}" onerror="this.src='https://placehold.co/300x450/1a1f2e/ffffff?text=Rank+3'">
                                <h3>${bestsellers[2].name}</h3>
                                <button class="buy-btn" style="margin-top:1.5rem;">Acquire Artifact</button>
                            </div>`;
                    }
                    spotlight.innerHTML = spotlightHtml;
                }

                // Others (Rank 4 and beyond)
                const list = document.getElementById('rankingList');
                if (bestsellers.length > 3) {
                    list.innerHTML = `<h2 style="margin-bottom:3rem; text-align:center;">Celestial Rankings</h2>` + 
                        bestsellers.slice(3).map((b, i) => `
                        <div class="rank-item">
                            <div class="rank-number">#${i+4}</div>
                            <img src="${api.getImageUrl(b.imagePath)}" class="rank-img" onerror="this.src='https://placehold.co/200x300/1a1f2e/ffffff?text=Rank+${i+4}'">
                            <div class="rank-info">
                                <h2>${b.name}</h2>
                                <p>${b.description ? b.description.substring(0, 150) + '...' : 'A timeless masterpiece that has captured the hearts of readers across the cosmos.'}</p>
                            </div>
                            <div class="rank-action">
                                <span class="price-tag">$${b.price}</span>
                                <button class="buy-btn" onclick="addToCart(${b.id})">Get This</button>
                            </div>
                        </div>
                    `).join('');
                } else if (bestsellers.length === 0) {
                    list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:5rem;">The Hall of Fame is currently empty. Nominate artifacts from the admin core.</p>`;
                }

                updateAuthUI();
            } catch (e) { console.error(e); }
        }

        function updateAuthUI() {
            const authNav = document.getElementById('navAuth');
            const user = session.get();
            if(user) {
                authNav.innerHTML = `<span style="font-weight:700;">${user.name}</span>`;
            }
        }

        init();
    </script>
</body>
</html>
