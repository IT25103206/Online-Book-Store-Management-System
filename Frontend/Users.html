<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | eSHELF</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-book-bookmark"></i></div>
            <div class="logo-text"><h2>eSHELF</h2><p>Digital Bookstore</p></div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="Dashboard.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a href="Authors.html" class="nav-link"><i class="fas fa-pen-nib"></i><span>Author Management</span></a></li>
            <li class="nav-item"><a href="Users.html" class="nav-link active"><i class="fas fa-users"></i><span>User Management</span></a></li>
            <li class="nav-item"><a href="Books.html" class="nav-link"><i class="fas fa-book"></i><span>Book Management</span></a></li>
            <li class="nav-item"><a href="Orders.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span>Order & Purchase Management</span></a></li>
            <li class="nav-item"><a href="Reviews.html" class="nav-link"><i class="fas fa-star"></i><span>Review & Rating Management</span></a></li>
            <li class="nav-item"><a href="Admin.html" class="nav-link"><i class="fas fa-user-shield"></i><span>Admin Management</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-link">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search users by name or email..."></div>
            <div class="header-actions"><i class="far fa-bell"></i><i class="fas fa-cog"></i><img src="https://ui-avatars.com/api/?name=Admin+User&background=10b981&color=fff" class="profile-img"></div>
        </header>
        <main class="content">
            <div class="card-header" style="margin-bottom: 2rem;">
                <h1>User Management</h1>
                <button class="btn btn-primary" id="btnAddUser"><i class="fas fa-user-plus"></i> Add New User</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table id="userTable">
                        <thead>
                            <tr>
                                <th>Profile</th>
                                <th>Role</th>
                                <th>Age</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

    <script src="js/api.js"></script>
    <script>
        let allUsers = [];
        const loadUsers = async () => {
            allUsers = await api.getUsers();
            renderUsers(allUsers);
        };

        const renderUsers = (users) => {
            document.querySelector('#userTable tbody').innerHTML = users.map(user => `
                <tr style="cursor:pointer;" onclick="viewUserProfile(${user.id})">
                    <td>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <img src="https://ui-avatars.com/api/?name=${user.name}&background=random" style="width:32px;height:32px;border-radius:50%;">
                            <div><div style="font-weight:600;">${user.name}</div><div style="font-size:0.8rem;color:gray;">${user.gmail}</div></div>
                        </div>
                    </td>
                    <td><span class="status-badge ${user.userType==='ADMIN'?'badge-danger':'badge-success'}">${user.userType}</span></td>
                    <td>${user.age}</td>
                    <td onclick="event.stopPropagation()">
                        <button class="btn btn-icon view-btn" onclick="viewUserProfile(${user.id})"><i class="fas fa-eye" style="color:var(--primary);"></i></button>
                        <button class="btn btn-icon delete-btn" data-id="${user.id}"><i class="fas fa-trash" style="color:#ef4444;"></i></button>
                    </td>
                </tr>
            `).join('');
            
            document.querySelectorAll('.delete-btn').forEach(btn => btn.onclick = async (e) => {
                if(confirm('Delete user?')) { await api.deleteUser(btn.dataset.id); loadUsers(); }
            });
        };

        const viewUserProfile = (id) => {
            const user = allUsers.find(u => u.id == id);
            if(!user) return;
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>User Profile Card</h2><i class="fas fa-times" id="closeModal"></i></div>
                <div style="text-align:center; margin-bottom:2rem;">
                    <img src="https://ui-avatars.com/api/?name=${user.name}&size=128&background=10b981&color=fff" style="width:100px; height:100px; border-radius:50%; margin-bottom:1rem; border:4px solid white; box-shadow:var(--shadow);">
                    <h2>${user.name}</h2>
                    <p style="color:gray;">${user.userType}</p>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; background:rgba(255,255,255,0.5); padding:1.5rem; border-radius:15px;">
                    <div><label style="display:block; font-size:0.75rem; color:gray; text-transform:uppercase; font-weight:700;">Email</label><strong>${user.gmail}</strong></div>
                    <div><label style="display:block; font-size:0.75rem; color:gray; text-transform:uppercase; font-weight:700;">Age</label><strong>${user.age || 'N/A'}</strong></div>
                    <div><label style="display:block; font-size:0.75rem; color:gray; text-transform:uppercase; font-weight:700;">Status</label><span class="status-badge badge-success">Active</span></div>
                    <div><label style="display:block; font-size:0.75rem; color:gray; text-transform:uppercase; font-weight:700;">Account ID</label><strong>#USR-${user.id}</strong></div>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-top:2rem; justify-content:center;" onclick="document.getElementById('modalOverlay').style.display='none'">Close Resume</button>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
        };

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => u.name.toLowerCase().includes(query) || u.gmail.toLowerCase().includes(query));
            renderUsers(filtered);
        };

        loadUsers();

        document.getElementById('btnAddUser').onclick = () => {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Register User</h2><i class="fas fa-times" id="closeModal"></i></div>
                <form id="userForm">
                    <div class="form-group"><label>Full Name</label><input type="text" name="name" placeholder="John Doe" required></div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group"><label>Email Address</label><input type="email" name="gmail" placeholder="john@example.com" required></div>
                        </div>
                        <div class="form-col">
                            <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="••••••••" required></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group"><label>Age</label><input type="number" name="age" placeholder="25"></div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>User Role (isadmin)</label>
                                <select name="isadmin">
                                    <option value="0">Regular User</option>
                                    <option value="1">Admin Access</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>User Type</label>
                        <select name="userType">
                            <option value="USER">Standard User</option>
                            <option value="ADMIN">System Admin</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 1rem; justify-content: center;">
                        <i class="fas fa-user-check"></i> Register User Account
                    </button>
                </form>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
            document.getElementById('userForm').onsubmit = async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target));
                data.isadmin = parseInt(data.isadmin);
                await api.createUser(data);
                modalOverlay.style.display = 'none';
                loadUsers();
            };
        };
    </script>
</body>
</html>
