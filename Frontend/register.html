<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Account | Lumina Books</title>
    <link rel="stylesheet" href="css/lumina.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { height: 100vh; display: flex; }
        .login-left {
            flex: 1;
            background: linear-gradient(to top, rgba(5,8,22,1), rgba(5,8,22,0.4)),
                         url('https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&q=80&w=2000') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 5%;
        }
        .login-right {
            flex: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5%;
        }
        .login-card {
            width: 100%;
            max-width: 550px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 3.5rem;
            border-radius: var(--radius-lg);
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }
        .input-group {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            transition: var(--transition);
        }
        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .input-group input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 1rem 0.5rem;
            flex-grow: 1;
            font-size: 1rem;
        }
        .input-group i { color: var(--text-muted); }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-left">
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">Join the Library</h1>
        <p style="font-size: 1.2rem; max-width: 400px;">Begin your journey through the universal collection of knowledge. Create your unique identity in the Lumina system.</p>
    </div>
    <div class="login-right">
        <div class="login-card">
            <h2 style="font-size: 2.2rem; margin-bottom: 0.5rem;">Forge Your Identity</h2>
            <p style="margin-bottom: 3rem;">Complete the registration to unlock the cosmic archives.</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Your Full Designation (Name)</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regName" placeholder="Aurelius Vance" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Celestial Address (Email)</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="name@lumina.com" required>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Access Cipher (Password)</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <div class="input-group">
                            <input type="number" id="regAge" placeholder="21" required>
                        </div>
                    </div>
                </div>
                <div style="margin-bottom: 2rem;">
                    <label style="display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem; cursor: pointer;">
                        <input type="checkbox" required style="accent-color: var(--primary);"> I accept the Lumina Codex of Conduct
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" id="regBtn" style="width: 100%; justify-content: center; padding: 1.2rem;">Forge Account</button>
            </form>

            <p style="text-align: center; margin-top: 3rem; font-weight: 600;">
                Already a reader? <a href="login.html" style="color: var(--primary); text-decoration: none;">Recall Access</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Forging Identity...';
            btn.disabled = true;

            const userData = {
                name: document.getElementById('regName').value,
                gmail: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                age: parseInt(document.getElementById('regAge').value),
                isadmin: 0,
                userType: 'USER'
            };

            try {
                const res = await api.createUser(userData);
                alert('Account successfully forged. Please login.');
                window.location.href = 'login.html';
            } catch (err) {
                alert('Registration failed. The cosmic address might already be in use.');
                btn.innerHTML = 'Forge Account';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
