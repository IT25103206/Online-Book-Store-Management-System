<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review & Rating Management | eSHELF</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-book-bookmark"></i></div>
            <div class="logo-text"><h2>eSHELF</h2><p>Digital Bookstore</p></div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="Dashboard.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a href="Authors.html" class="nav-link"><i class="fas fa-pen-nib"></i><span>Author Management</span></a></li>
            <li class="nav-item"><a href="Users.html" class="nav-link"><i class="fas fa-users"></i><span>User Management</span></a></li>
            <li class="nav-item"><a href="Books.html" class="nav-link"><i class="fas fa-book"></i><span>Book Management</span></a></li>
            <li class="nav-item"><a href="Orders.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span>Order & Purchase Management</span></a></li>
            <li class="nav-item"><a href="Reviews.html" class="nav-link active"><i class="fas fa-star"></i><span>Review & Rating Management</span></a></li>
            <li class="nav-item"><a href="Admin.html" class="nav-link"><i class="fas fa-user-shield"></i><span>Admin Management</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-link">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search reviews by comment..."></div>
            <div class="header-actions"><i class="far fa-bell"></i><i class="fas fa-cog"></i><img src="https://ui-avatars.com/api/?name=Admin+User&background=10b981&color=fff" class="profile-img"></div>
        </header>
        <main class="content">
            <div class="card-header" style="margin-bottom: 2rem;">
                <h1>Review & Rating Management</h1>
                <button class="btn btn-primary" id="btnAddReview"><i class="fas fa-star"></i> Add New Review</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table id="reviewTable">
                        <thead>
                            <tr>
                                <th>Rating</th>
                                <th>Comment</th>
                                <th>User ID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

    <script src="js/api.js"></script>
    <script>
        let allReviews = [];
        const loadReviews = async () => {
            allReviews = await api.getReviews();
            renderReviews(allReviews);
        };

        const renderReviews = (reviews) => {
            document.querySelector('#reviewTable tbody').innerHTML = reviews.map(rev => `
                <tr style="cursor:pointer;" onclick="viewReviewDetail(${rev.id})">
                    <td><div style="color:#f59e0b;">${Array(rev.rating).fill('<i class="fas fa-star"></i>').join('')}</div></td>
                    <td>${rev.comment.substring(0, 50)}...</td>
                    <td>USR-${rev.userId}</td>
                    <td onclick="event.stopPropagation()">
                        <button class="btn btn-icon view-btn" onclick="viewReviewDetail(${rev.id})"><i class="fas fa-comment-dots" style="color:var(--primary);"></i></button>
                        <button class="btn btn-icon delete-btn" data-id="${rev.id}"><i class="fas fa-trash" style="color:#ef4444;"></i></button>
                    </td>
                </tr>
            `).join('');
            
            document.querySelectorAll('.delete-btn').forEach(btn => btn.onclick = async (e) => {
                if(confirm('Delete review?')) { await api.deleteReview(btn.dataset.id); loadReviews(); }
            });
        };

        const viewReviewDetail = (id) => {
            const rev = allReviews.find(r => r.id == id);
            if(!rev) return;
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Reader Review Card</h2><i class="fas fa-times" id="closeModal"></i></div>
                <div style="text-align:center; margin-bottom:2rem;">
                    <div style="color:#f59e0b; font-size:2rem; margin-bottom:1rem;">
                        ${Array(rev.rating).fill('<i class="fas fa-star"></i>').join('')}
                    </div>
                    <p style="font-size:1.1rem; line-height:1.6; font-style:italic; padding: 0 1rem;">"${rev.comment}"</p>
                </div>
                <div style="display:flex; justify-content:center; gap:2rem; border-top:1px solid #f1f5f9; padding-top:1.5rem;">
                    <div style="text-align:center;"><label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700;">Reader ID</label><strong>USR-${rev.userId}</strong></div>
                    <div style="text-align:center;"><label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700;">Book ID</label><strong>BK-${rev.bookId || 'N/A'}</strong></div>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-top:2.5rem; justify-content:center;" onclick="document.getElementById('modalOverlay').style.display='none'">Dismiss</button>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
        };

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allReviews.filter(r => r.comment.toLowerCase().includes(query));
            renderReviews(filtered);
        };

        loadReviews();

        document.getElementById('btnAddReview').onclick = () => {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Add New Review</h2><i class="fas fa-times" id="closeModal"></i></div>
                <form id="reviewForm">
                    <div class="form-group"><label>User ID</label><input type="number" name="userId" required></div>
                    <div class="form-group"><label>Book ID</label><input type="number" name="bookId" required></div>
                    <div class="form-group"><label>Rating (1-5)</label><input type="number" name="rating" min="1" max="5" required></div>
                    <div class="form-group"><label>Review Comment</label><textarea name="comment" rows="4" required></textarea></div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 1rem; justify-content: center;">
                        <i class="fas fa-star"></i> Post Review
                    </button>
                </form>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
            document.getElementById('reviewForm').onsubmit = async (e) => {
                e.preventDefault();
                modalOverlay.style.display = 'none';
                loadReviews();
            };
        };
    </script>
</body>
</html>
