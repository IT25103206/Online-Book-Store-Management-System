<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management | eSHELF</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-book-bookmark"></i></div>
            <div class="logo-text"><h2>eSHELF</h2><p>Digital Bookstore</p></div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="Dashboard.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a href="Authors.html" class="nav-link"><i class="fas fa-pen-nib"></i><span>Author Management</span></a></li>
            <li class="nav-item"><a href="Users.html" class="nav-link"><i class="fas fa-users"></i><span>User Management</span></a></li>
            <li class="nav-item"><a href="Books.html" class="nav-link active"><i class="fas fa-book"></i><span>Book Management</span></a></li>
            <li class="nav-item"><a href="Orders.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span>Order & Purchase Management</span></a></li>
            <li class="nav-item"><a href="Reviews.html" class="nav-link"><i class="fas fa-star"></i><span>Review & Rating Management</span></a></li>
            <li class="nav-item"><a href="Admin.html" class="nav-link"><i class="fas fa-user-shield"></i><span>Admin Management</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-link">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search books by title..."></div>
            <div class="header-actions"><i class="far fa-bell"></i><i class="fas fa-cog"></i><img src="https://ui-avatars.com/api/?name=Admin+User&background=10b981&color=fff" class="profile-img"></div>
        </header>
        <main class="content">
            <div class="card-header" style="margin-bottom: 2rem;">
                <h1>Book Management</h1>
                <button class="btn btn-primary" id="btnAddBook"><i class="fas fa-plus"></i> Add New Book</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table id="bookTable">
                        <thead>
                            <tr>
                                <th>Book Name</th>
                                <th>Type</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

    <script src="js/api.js"></script>
    <script>
        let allBooks = [];
        const loadBooks = async () => {
            allBooks = await api.getBooks();
            renderBooks(allBooks);
        };

        const renderBooks = (books) => {
            document.querySelector('#bookTable tbody').innerHTML = books.map(book => `
                <tr style="cursor:pointer;" onclick="viewBookDetails(${book.id})">
                    <td style="font-weight:600;">${book.name}</td>
                    <td><span class="status-badge ${book.bookType==='EBOOK'?'badge-success':'badge-warning'}">${book.bookType}</span></td>
                    <td>$${book.price}</td>
                    <td>${book.quantity}</td>
                    <td onclick="event.stopPropagation()">
                        <button class="btn btn-icon view-btn" onclick="viewBookDetails(${book.id})"><i class="fas fa-book-open" style="color:var(--primary);"></i></button>
                        <button class="btn btn-icon delete-btn" data-id="${book.id}"><i class="fas fa-trash" style="color:#ef4444;"></i></button>
                    </td>
                </tr>
            `).join('');
            
            document.querySelectorAll('.delete-btn').forEach(btn => btn.onclick = async (e) => {
                if(confirm('Delete book?')) { await api.deleteBook(btn.dataset.id); loadBooks(); }
            });
        };

        const viewBookDetails = (id) => {
            const book = allBooks.find(b => b.id == id);
            if(!book) return;
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Book Specification</h2><i class="fas fa-times" id="closeModal"></i></div>
                <div style="display:flex; gap:2rem;">
                    <div style="width:180px; height:260px; background:#f1f5f9; border-radius:12px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);">
                        <i class="fas fa-book" style="font-size:4rem; color:#cbd5e1;"></i>
                    </div>
                    <div style="flex:1;">
                        <h1 style="margin-bottom:0.5rem;">${book.name}</h1>
                        <p style="color:var(--primary); font-weight:700; font-size:1.5rem; margin-bottom:1rem;">$${book.price}</p>
                        <div style="margin-bottom:1.5rem;">
                            <label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700; margin-bottom:0.3rem;">Description</label>
                            <p style="color:#475569; font-size:0.9rem; line-height:1.5;">${book.description || 'No description available for this volume.'}</p>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; padding-top:1rem; border-top:1px solid #f1f5f9;">
                            <div><label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700;">Format</label><span class="status-badge badge-info">${book.bookType}</span></div>
                            <div><label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700;">Stock</label><strong>${book.quantity} Units</strong></div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-top:2rem; justify-content:center;" onclick="document.getElementById('modalOverlay').style.display='none'">Back to Library</button>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
        };

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allBooks.filter(b => b.name.toLowerCase().includes(query));
            renderBooks(filtered);
        };

        loadBooks();

        document.getElementById('btnAddBook').onclick = () => {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Add New Book</h2><i class="fas fa-times" id="closeModal"></i></div>
                <form id="bookForm">
                    <div class="form-group"><label>Book Name</label><input type="text" name="name" placeholder="Enter book title" required></div>
                    <div class="form-group"><label>Description</label><textarea name="description" rows="3" placeholder="Brief summary of the book..."></textarea></div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Book Type</label>
                                <select name="bookType" id="bookTypeSelect">
                                    <option value="BOOK">Standard Book</option>
                                    <option value="EBOOK">E-Book</option>
                                    <option value="PRINTED">Printed Book</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group"><label>Price ($)</label><input type="text" name="price" placeholder="29.99" required></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group"><label>Stock Quantity</label><input type="number" name="quantity" value="0" required></div>
                        </div>
                        <div class="form-col">
                            <div class="form-group"><label>Author ID</label><input type="number" name="authorId" required></div>
                        </div>
                    </div>
                    
                    <div id="ebookFields" style="display:none;">
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-group"><label>Download URL</label><input type="text" name="downloadUrl" placeholder="https://..."></div>
                            </div>
                            <div class="form-col">
                                <div class="form-group"><label>File Size (MB)</label><input type="number" step="0.01" name="fileSizeMb" placeholder="1.5"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="printedFields" style="display:none;">
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-group"><label>Weight (kg)</label><input type="number" step="0.01" name="weight" placeholder="0.5"></div>
                            </div>
                            <div class="form-col">
                                <div class="form-group"><label>Dimensions</label><input type="text" name="dimensions" placeholder="e.g. 20x15x3 cm"></div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 1rem; justify-content: center;">
                        <i class="fas fa-save"></i> Save Book Details
                    </button>
                </form>
            `;
            modalOverlay.style.display = 'flex';
            
            const typeSelect = document.getElementById('bookTypeSelect');
            const ebookFields = document.getElementById('ebookFields');
            const printedFields = document.getElementById('printedFields');
            
            typeSelect.onchange = () => {
                ebookFields.style.display = typeSelect.value === 'EBOOK' ? 'block' : 'none';
                printedFields.style.display = typeSelect.value === 'PRINTED' ? 'block' : 'none';
            };

            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
            document.getElementById('bookForm').onsubmit = async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target));
                await api.createBook(data);
                modalOverlay.style.display = 'none';
                loadBooks();
            };
        };
    </script>
</body>
</html>
