<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Arrivals | Fresh Chronicles</title>
    <link rel="stylesheet" href="css/lumina.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --primary: #8b5cf6;
        }

        body { background: var(--bg); color: white; font-family: 'Outfit', sans-serif; }

        nav {
            padding: 1.5rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-logo { font-size: 1.6rem; font-weight: 800; color: white; text-decoration: none; }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .nav-links a.active { color: white; }

        .chronicle-header {
            padding: 6rem 6% 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 4rem;
        }
        .chronicle-header h1 { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; }
        .chronicle-header span { color: var(--accent); font-weight: 800; letter-spacing: 2px; }

        /* Timeline Layout */
        .timeline-container { padding: 0 6% 10rem; position: relative; }
        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            opacity: 0.3;
        }

        .arrival-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8rem;
            width: 100%;
            position: relative;
        }
        .arrival-block:nth-child(even) { flex-direction: row-reverse; }

        .arrival-media { width: 45%; text-align: center; }
        .arrival-media img {
            width: 300px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            transition: 0.5s;
        }
        .arrival-block:hover .arrival-media img { transform: translateY(-20px) rotate(3deg); }

        .arrival-content { width: 45%; padding: 2rem; }
        .arrival-date {
            display: inline-block;
            padding: 6px 15px;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }
        .arrival-content h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
        .arrival-content p { color: #94a3b8; font-size: 1.1rem; line-height: 1.7; margin-bottom: 2rem; }

        .new-btn {
            background: white;
            color: black;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .new-btn:hover { background: var(--accent); color: white; transform: scale(1.05); }

        /* Floating Marker */
        .timeline-marker {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent);
        }

    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">Lumina Books</a>
        <ul class="nav-links">
            <li><a href="browse.html">Browse</a></li>
            <li><a href="bestsellers.html">Bestsellers</a></li>
            <li><a href="new-arrivals.html" class="active">New Arrivals</a></li>
        </ul>
        <div id="navAuth"></div>
    </nav>

    <header class="chronicle-header">
        <div>
            <span>SYSTEM UPDATE: SUCCESSFUL</span>
            <h1>Fresh Chronicles</h1>
        </div>
        <p style="color: #94a3b8; max-width: 300px; text-align: right;">Discover the latest manuscripts synced from the celestial archives.</p>
    </header>

    <div class="timeline-container">
        <div class="timeline-line"></div>
        <div id="arrivalsList">
            <!-- New books here -->
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function init() {
            try {
                const books = await api.getBooks();
                // Sort by ID descending to get newest first
                const newest = books.sort((a,b) => b.id - a.id).slice(0, 8);
                
                const list = document.getElementById('arrivalsList');
                if (newest.length > 0) {
                    list.innerHTML = newest.map((b, i) => `
                        <div class="arrival-block">
                            <div class="timeline-marker"></div>
                            <div class="arrival-media">
                                <img src="${api.getImageUrl(b.imagePath)}" onerror="this.src='https://placehold.co/300x450/1a1f2e/ffffff?text=New+Artifact'">
                            </div>
                            <div class="arrival-content">
                                <span class="arrival-date">RECENTLY ARCHIVED</span>
                                <h2>${b.name}</h2>
                                <p>${b.description || 'A fresh manuscript full of undiscovered wisdom, recently added to the Lumina digital archives for your enlightenment.'}</p>
                                <button class="new-btn" onclick="addToCart(${b.id})">Begin Reading • $${b.price}</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:10rem 0;">No fresh manuscripts have arrived recently.</p>`;
                }

            } catch (e) { console.error(e); }
        }

        function addToCart(bookId) {
            api.getBooks().then(books => {
                const book = books.find(b => b.id === bookId);
                if (!book) return;
                
                const cart = JSON.parse(localStorage.getItem('lumina_cart') || '[]');
                const existing = cart.find(item => item.id === bookId);
                
                if (existing) {
                    existing.qty = (existing.qty || 1) + 1;
                } else {
                    cart.push({ ...book, qty: 1 });
                }
                
                localStorage.setItem('lumina_cart', JSON.stringify(cart));
                alert(`${book.name} added to your cosmic collection!`);
                location.href = 'cart.html';
            });
        }

        init();
    </script>
</body>
</html>
