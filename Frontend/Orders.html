<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management | eSHELF</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-book-bookmark"></i></div>
            <div class="logo-text"><h2>eSHELF</h2><p>Digital Bookstore</p></div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="Dashboard.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a href="Authors.html" class="nav-link"><i class="fas fa-pen-nib"></i><span>Author Management</span></a></li>
            <li class="nav-item"><a href="Users.html" class="nav-link"><i class="fas fa-users"></i><span>User Management</span></a></li>
            <li class="nav-item"><a href="Books.html" class="nav-link"><i class="fas fa-book"></i><span>Book Management</span></a></li>
            <li class="nav-item"><a href="Orders.html" class="nav-link active"><i class="fas fa-shopping-cart"></i><span>Order & Purchase Management</span></a></li>
            <li class="nav-item"><a href="Reviews.html" class="nav-link"><i class="fas fa-star"></i><span>Review & Rating Management</span></a></li>
            <li class="nav-item"><a href="Admin.html" class="nav-link"><i class="fas fa-user-shield"></i><span>Admin Management</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-link">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search orders by ID..."></div>
            <div class="header-actions"><i class="far fa-bell"></i><i class="fas fa-cog"></i><img src="https://ui-avatars.com/api/?name=Admin+User&background=10b981&color=fff" class="profile-img"></div>
        </header>
        <main class="content">
            <div class="card-header" style="margin-bottom: 2rem;">
                <h1>Order & Purchase Management</h1>
                <button class="btn btn-primary" id="btnAddOrder"><i class="fas fa-shopping-cart"></i> Add New Order</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table id="orderTable">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>User ID</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

    <script src="js/api.js"></script>
    <script>
        let allOrders = [];
        const loadOrders = async () => {
            allOrders = await api.getOrders();
            renderOrders(allOrders);
        };

        const renderOrders = (orders) => {
            document.querySelector('#orderTable tbody').innerHTML = orders.map(order => `
                <tr style="cursor:pointer;" onclick="viewOrderResume(${order.id})">
                    <td>ORD-${order.id}</td>
                    <td>${order.date}</td>
                    <td>USER-${order.userId}</td>
                    <td><span class="status-badge badge-success">Completed</span></td>
                    <td onclick="event.stopPropagation()">
                        <button class="btn btn-icon view-btn" onclick="viewOrderResume(${order.id})"><i class="fas fa-file-invoice" style="color:var(--primary);"></i></button>
                        <button class="btn btn-icon delete-btn" data-id="${order.id}"><i class="fas fa-trash" style="color:#ef4444;"></i></button>
                    </td>
                </tr>
            `).join('');
            
            document.querySelectorAll('.delete-btn').forEach(btn => btn.onclick = async (e) => {
                if(confirm('Delete order?')) { await api.deleteOrder(btn.dataset.id); loadOrders(); }
            });
        };

        const viewOrderResume = (id) => {
            const order = allOrders.find(o => o.id == id);
            if(!order) return;
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Order Invoice Summary</h2><i class="fas fa-times" id="closeModal"></i></div>
                <div style="background:#f8fafc; padding:2rem; border-radius:15px; border:1px dashed #cbd5e1;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:2rem;">
                        <div><h2 style="color:var(--primary);">ORD-${order.id}</h2><p>Date: ${order.date}</p></div>
                        <div style="text-align:right;"><span class="status-badge badge-success">PAID</span></div>
                    </div>
                    <div style="margin-bottom:2rem;">
                        <label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700;">Customer</label>
                        <strong>User ID: ${order.userId}</strong>
                    </div>
                    <div style="border-top:2px solid white; padding-top:1rem;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;"><span>Base Amount</span><strong>$0.00</strong></div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;"><span>Tax (0%)</span><strong>$0.00</strong></div>
                        <div style="display:flex; justify-content:space-between; margin-top:1rem; font-size:1.25rem; font-weight:700; color:var(--secondary);"><span>Total</span><strong>$0.00</strong></div>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-top:2rem; justify-content:center;" onclick="document.getElementById('modalOverlay').style.display='none'">Print Receipt</button>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
        };

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allOrders.filter(o => o.id.toString().includes(query));
            renderOrders(filtered);
        };

        loadOrders();

        document.getElementById('btnAddOrder').onclick = () => {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Add New Order</h2><i class="fas fa-times" id="closeModal"></i></div>
                <form id="orderForm">
                    <div class="form-group"><label>Customer (User ID)</label><input type="number" name="userId" required></div>
                    <div class="form-group"><label>Order Date</label><input type="date" name="date" required></div>
                    <div class="form-group">
                        <label>Order Status</label>
                        <select name="statusId">
                            <option value="1">Pending</option>
                            <option value="2">Processing</option>
                            <option value="3">Shipped</option>
                            <option value="4">Delivered</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 1rem; justify-content: center;">
                        <i class="fas fa-shopping-cart"></i> Process Order
                    </button>
                </form>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
            document.getElementById('orderForm').onsubmit = async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target));
                await api.updateOrder(data); 
                modalOverlay.style.display = 'none';
                loadOrders();
            };
        };
    </script>
</body>
</html>
