<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Management | eSHELF</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-book-bookmark"></i></div>
            <div class="logo-text"><h2>eSHELF</h2><p>Digital Bookstore</p></div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="Dashboard.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a href="Authors.html" class="nav-link active"><i class="fas fa-pen-nib"></i><span>Author Management</span></a></li>
            <li class="nav-item"><a href="Users.html" class="nav-link"><i class="fas fa-users"></i><span>User Management</span></a></li>
            <li class="nav-item"><a href="Books.html" class="nav-link"><i class="fas fa-book"></i><span>Book Management</span></a></li>
            <li class="nav-item"><a href="Orders.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span>Order & Purchase Management</span></a></li>
            <li class="nav-item"><a href="Reviews.html" class="nav-link"><i class="fas fa-star"></i><span>Review & Rating Management</span></a></li>
            <li class="nav-item"><a href="Admin.html" class="nav-link"><i class="fas fa-user-shield"></i><span>Admin Management</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-link">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search authors by name..."></div>
            <div class="header-actions"><i class="far fa-bell"></i><i class="fas fa-cog"></i><img src="https://ui-avatars.com/api/?name=Admin+User&background=10b981&color=fff" class="profile-img"></div>
        </header>
        <main class="content">
            <div class="card-header" style="margin-bottom: 2rem;">
                <h1>Author Registry</h1>
                <button class="btn btn-primary" id="btnAddAuthor"><i class="fas fa-plus"></i> Register Author</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table id="authorTable">
                        <thead>
                            <tr>
                                <th>Author Name</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

    <script src="js/api.js"></script>
    <script>
        let allAuthors = [];
        const loadAuthors = async () => {
            allAuthors = await api.getAuthors();
            renderAuthors(allAuthors);
        };

        const renderAuthors = (authors) => {
            const tbody = document.querySelector('#authorTable tbody');
            tbody.innerHTML = authors.map(auth => `
                <tr style="cursor:pointer;" onclick="viewAuthorProfile(${auth.id})">
                    <td style="font-weight: 600;">${auth.name}</td>
                    <td><span class="status-badge badge-warning">${auth.authorType || 'AUTHOR'}</span></td>
                    <td>${auth.discription ? auth.discription.substring(0, 50) + '...' : 'No bio available'}</td>
                    <td onclick="event.stopPropagation()">
                        <button class="btn btn-icon view-btn" onclick="viewAuthorProfile(${auth.id})"><i class="fas fa-id-card" style="color:var(--primary);"></i></button>
                        <button class="btn btn-icon delete-btn" data-id="${auth.id}"><i class="fas fa-trash" style="color: #ef4444;"></i></button>
                    </td>
                </tr>
            `).join('');
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    if(confirm('Delete author?')) {
                        await api.deleteAuthor(btn.dataset.id);
                        loadAuthors();
                    }
                }
            });
        };

        const viewAuthorProfile = (id) => {
            const auth = allAuthors.find(a => a.id == id);
            if(!auth) return;
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Author Biography (Resume)</h2><i class="fas fa-times" id="closeModal"></i></div>
                <div style="display:flex; gap:2rem; align-items:flex-start;">
                    <div style="text-align:center; min-width:150px;">
                        <img src="https://ui-avatars.com/api/?name=${auth.name}&size=128&background=random" style="width:120px; height:120px; border-radius:15px; margin-bottom:1rem; box-shadow:var(--shadow);">
                        <h3 style="margin-bottom:0.5rem;">${auth.name}</h3>
                        <span class="status-badge badge-warning">${auth.authorType || 'Internal Author'}</span>
                    </div>
                    <div style="flex:1;">
                        <div style="margin-bottom:1.5rem;">
                            <label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700; margin-bottom:0.5rem;">Biography</label>
                            <p style="line-height:1.6; color:#475569;">${auth.discription || 'No detailed biography provided for this author.'}</p>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; border-top:1px solid #f1f5f9; padding-top:1.5rem;">
                            <div><label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700;">Registry ID</label><strong>#ATH-${auth.id}</strong></div>
                            <div><label style="display:block; font-size:0.7rem; color:gray; text-transform:uppercase; font-weight:700;">Contribution</label><strong>Multiple Works</strong></div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-top:2.5rem; justify-content:center;" onclick="document.getElementById('modalOverlay').style.display='none'">Return to List</button>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
        };

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allAuthors.filter(a => a.name.toLowerCase().includes(query));
            renderAuthors(filtered);
        };

        loadAuthors();

        document.getElementById('btnAddAuthor').onclick = () => {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-header"><h2>Register Author</h2><i class="fas fa-times" id="closeModal"></i></div>
                <form id="authorForm">
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group"><label>Author Name</label><input type="text" name="name" placeholder="Author Name" required></div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Author Type</label>
                                <select name="authorType">
                                    <option value="AUTHOR">Standard Author</option>
                                    <option value="GUEST">Guest Author</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group"><label>Biography (Discription)</label><textarea name="discription" rows="4" placeholder="Brief history or achievements..." required></textarea></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                        <i class="fas fa-pen"></i> Register Author Profile
                    </button>
                </form>
            `;
            modalOverlay.style.display = 'flex';
            document.getElementById('closeModal').onclick = () => modalOverlay.style.display = 'none';
            document.getElementById('authorForm').onsubmit = async (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target));
                await api.createAuthor(data);
                modalOverlay.style.display = 'none';
                loadAuthors();
            };
        };
    </script>
</body>
</html>
